# Compila e testa o emulador standalone (a interface desktop) nas cinco plataformas.
#
# O que este trabalho responde é "o binário sai e os testes passam?", que o `release.yml` **não**
# responde: ele roda em tag, empacota, e deixa os testes como `continue-on-error` para não segurar
# os instaladores.
#
# Custo: cada plataforma compila o `unicorn` (QEMU em C) e o `dynarmic` (JIT em C++20), uns 15
# minutos por runner. Por isso a matriz completa roda em **push** para as ramas de desenvolvimento e
# sob demanda; em PR roda só o Linux x86_64, onde o retorno precisa ser rápido.
#
# **A lista de PR é escolhida por expressão, não por `if` de job**: o contexto `matrix` não existe
# em `jobs.<id>.if` — o GitHub rejeita o arquivo inteiro, e o sintoma é um run sem job nenhum.
#
# Windows e macOS usam os mesmos passos do `release.yml`, onde eles já produzem instalador: é a
# prova de que o build passa. Os **testes** nesses dois ficam tolerantes a falha enquanto ninguém
# tiver olhado o resultado deles, como no release.

name: ci

on:
  push:
    branches: [development, master, main, "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compila:
    name: ${{ matrix.nome }}
    runs-on: ${{ matrix.sistema }}
    strategy:
      fail-fast: false
      matrix:
        alvo: ${{ github.event_name == 'pull_request'
                  && fromJSON('["linux-x86_64"]')
                  || fromJSON('["linux-x86_64","linux-aarch64","windows-x86_64","macos-arm64","macos-x86_64"]') }}
        include:
          - alvo: linux-x86_64
            nome: linux-x86_64
            sistema: ubuntu-24.04
            binario: target/release/zeebx
          - alvo: linux-aarch64
            nome: linux-aarch64
            sistema: ubuntu-24.04-arm
            binario: target/release/zeebx
          - alvo: windows-x86_64
            nome: windows-x86_64
            sistema: windows-latest
            binario: target/release/zeebx.exe
          - alvo: macos-arm64
            nome: macos-arm64
            sistema: macos-latest
            binario: target/release/zeebx
          - alvo: macos-x86_64
            nome: macos-x86_64
            sistema: macos-15-intel
            binario: target/release/zeebx
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-${{ matrix.nome }}

      # A lista do Linux é a do `release.yml`, mais `ninja` e `libclang` de propósito: o `dynarmic`
      # pede gerador Ninja e o `bindgen` do unicorn carrega a biblioteca do clang. Depender do que a
      # imagem do runner já traz funciona até o dia em que não traz.
      - name: Dependências do Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config python3 libclang-dev \
            libglib2.0-dev libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev \
            libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev

      - name: Dependências do macOS
        if: runner.os == 'macOS'
        run: brew install cmake ninja pkg-config || true

      # Sem debuginfo a árvore passa de mais de 5 GiB para algumas centenas de MB — o mesmo motivo
      # que fez o build local encher o disco.
      - name: Compila
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: cargo build --release --locked

      - name: Testes
        # Windows e macOS: ninguém olhou esses testes ainda, e um tropeço deles não pode esconder o
        # resultado do build. No Linux é para valer.
        continue-on-error: ${{ runner.os != 'Linux' }}
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: cargo test --release --locked

      - name: O binário existe
        shell: bash
        run: ls -la ${{ matrix.binario }}

      - name: O binário abre no Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          file ${{ matrix.binario }}
          ldd ${{ matrix.binario }} | head -20
          # `controles` lista o que o sistema vê de controle e sai: é o comando mais barato que
          # exercita a inicialização de verdade (udev, gilrs) sem precisar de tela.
          ${{ matrix.binario }} controles

      - uses: actions/upload-artifact@v4
        with:
          name: zeebx-${{ matrix.nome }}
          path: ${{ matrix.binario }}
