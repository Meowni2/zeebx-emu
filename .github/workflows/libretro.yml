# Compila o core Libretro e confere que ele é carregável e completo.
#
# O core é um pacote separado (`frontends/libretro`) e o build dele **não** usa biblioteca de
# interface: sem ALSA, sem udev, sem Wayland ou X11. As provas, em ordem de força:
#
# 1. a biblioteca **carrega** de verdade (`ctypes` = `dlopen`/`LoadLibrary`, como o frontend faz) —
#    isso apanha dependência que faltou no link, que uma lista de símbolos não apanha;
# 2. os 25 símbolos `retro_*` respondem, `retro_api_version` devolve 1 e `retro_get_system_info`
#    preenche a struct com `Zeebx`, `mod|zip`, `need_fullpath` e `block_extract`;
# 3. no Linux, `ldd` mostra que não há `libX11`, Wayland, EGL, ALSA, udev nem GTK pendurados.
#
# Cada alvo roda no seu próprio runner: AArch64 Linux e Windows em runner ARM64 nativo, porque
# cross-build de `unicorn` (QEMU em C) e `dynarmic` (C++20 com CMake) exigiria toolchain e sysroot
# que ninguém quer manter só para empacotar.

name: libretro

on:
  push:
    branches: [development, master, main, "feat/**", "fix/**"]
    paths:
      - "frontends/libretro/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - ".github/workflows/libretro.yml"
  pull_request:
    paths:
      - "frontends/libretro/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/libretro.yml"
  workflow_dispatch:

# Ver a nota do `ci.yml`: em push, a execucao nova espera em vez de derrubar a que esta rodando.
concurrency:
  group: libretro-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    name: core-${{ matrix.nome }}
    runs-on: ${{ matrix.sistema }}
    strategy:
      fail-fast: false
      matrix:
        # Em PR, só o alvo barato: a matriz inteira é coisa de push.
        alvo: ${{ github.event_name == 'pull_request'
                  && fromJSON('["linux-x86_64"]')
                  || fromJSON('["linux-x86_64","linux-aarch64","windows-x86_64","windows-aarch64","macos-x86_64","macos-arm64"]') }}
        include:
          - alvo: linux-x86_64
            nome: linux-x86_64
            sistema: ubuntu-24.04
            biblioteca: target/release/libzeebx_libretro.so
            pacote: zeebx_libretro.so
          - alvo: linux-aarch64
            nome: linux-aarch64
            sistema: ubuntu-24.04-arm
            biblioteca: target/release/libzeebx_libretro.so
            pacote: zeebx_libretro.so
          - alvo: windows-x86_64
            nome: windows-x86_64
            sistema: windows-latest
            biblioteca: target/release/zeebx_libretro.dll
            pacote: zeebx_libretro.dll
          - alvo: windows-aarch64
            nome: windows-aarch64
            sistema: windows-11-arm
            # Windows ARM64 **não** tem o `unicorn` (falta montador MASM para ARM64 e o QEMU do Windows
            # monta um `.asm` com o `ml` do MSVC, que só existe para x86 e x64). O alvo compila assim
            # mesmo: o `unicorn-engine` sai do grafo por dependência condicional de alvo e o motor usa o
            # `dynarmic`, que recompila os blocos A32. Ver `src/cpu/mod.rs`, `BackendPadrao`.
            # monta `qemu/util/setjmp-wrapper-win32.asm` com o `ml` do MSVC — que so existe para x86 e x64.
            # Nao ha montador MASM para ARM64, entao o `ml` nao e encontrado (o log traz "CreateProcess
            # failed: The system cannot find the file specified") e o build para ali. O `unicorn-engine`
            # 2.1.5 e a ultima versao publicada, e o QEMU nao tem o Windows ARM64 como host. O alvo fica na
            # matriz para o dia em que isso mudar, ou para o dia em que o unicorn virar opcional nesta
            # plataforma; enquanto isso, ele nao derruba a rodada.
            biblioteca: target/release/zeebx_libretro.dll
            pacote: zeebx_libretro.dll
          - alvo: macos-x86_64
            nome: macos-x86_64
            sistema: macos-15-intel
            biblioteca: target/release/libzeebx_libretro.dylib
            pacote: zeebx_libretro.dylib
          - alvo: macos-arm64
            nome: macos-arm64
            sistema: macos-latest
            biblioteca: target/release/libzeebx_libretro.dylib
            pacote: zeebx_libretro.dylib
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: libretro-${{ matrix.nome }}

      # As duas dependências nativas: o `unicorn-engine` compila o QEMU em C e usa o `bindgen`
      # (que carrega o `libclang`), e o `dynarmic` compila C++20 com CMake e Ninja. Depender do que
      # a imagem do runner já traz funciona até o dia em que não traz.
      - name: Dependências do build (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config python3 \
            libclang-dev libglib2.0-dev

      - name: Dependências do build (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja pkg-config || true

      # Sem debuginfo a árvore do `dynarmic` sai de mais de 5 GiB para algumas centenas de MB.
      - name: Compila o core
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: cargo build --release --locked -p zeebx-libretro

      # A prova principal: abrir a biblioteca como o frontend abre e chamar a ABI.
      - name: A biblioteca carrega e a ABI responde
        run: python3 ferramentas/verifica_core.py "${{ matrix.biblioteca }}"

      - name: O core não depende de biblioteca de host (Linux)
        if: runner.os == 'Linux'
        run: |
          ldd "${{ matrix.biblioteca }}"
          if ldd "${{ matrix.biblioteca }}" | grep -qiE 'libX11|wayland|EGL|libGL|asound|libudev|gtk'; then
            echo "o core puxou biblioteca de interface: vídeo, áudio e entrada são do frontend"
            exit 1
          fi
          echo "só libc, libm, libstdc++ e libgcc"

      - name: Monta o pacote do core
        shell: bash
        run: |
          mkdir -p pacote
          cp "${{ matrix.biblioteca }}" "pacote/${{ matrix.pacote }}"
          cp frontends/libretro/zeebx_libretro.info pacote/
          grep -q '^database = "Mobile - Zeebo"' pacote/zeebx_libretro.info
          ls -la pacote/

      - uses: actions/upload-artifact@v4
        with:
          name: zeebx_libretro_${{ matrix.nome }}
          path: pacote/
