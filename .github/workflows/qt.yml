# A interface Qt: compila e testa o standalone com a feature `ui-qt` nos três sistemas. Nasceu
# como o ponto 4 da fase 0 de `docs/implementacao/21-migracao-para-qt.md`; desde a fase 8, com a
# feature, o Qt é a interface padrão, e a do egui fica em `zeebx egui`.
#
# **Separado do `ci.yml` de propósito.** O `ci.yml` responde se o binário que vai para a release
# sai; este responde se a migração para Qt é viável fora do Linux em que ela nasceu. Um Qt que não
# instala num runner não pode deixar vermelho o CI de quem só mexeu no motor.
#
# O Qt vem do `install-qt-action`, e não do sistema: o do `apt` do Ubuntu 24.04 é o 6.4.
#
# **É o 6.11, e não o 6.8 LTS.** O `6.8.*` resolveu para o 6.8.3, e o `qyieldcpu.h` dela chama
# `__yield()` direto no ARM. O clang do Xcode do `macos-latest` passou a exigir o `<arm_acle.h>`
# para isso, e o macOS ARM64 não compilava nem o `init.cpp` do próprio cxx-qt. O 6.11 tenta
# `__builtin_arm_yield` primeiro — conferido no cabeçalho — e é o mesmo Qt do Linux em que a
# interface é desenvolvida.
#
# **Menos no Windows, que fica no 6.10.** A partir do 6.11 o repositório do Qt para Windows ganhou
# uma pasta por arquitetura (`qt6_6112/qt6_6112_msvc2022_64/`), e o índice único que o
# `aqtinstall` procura (`qt6_6112/qt6_6112/Updates.xml`) não existe mais: 404, conferido no
# `download.qt.io`. O `aqtinstall` 3.3.0, o mais novo publicado, ainda não entende a pasta nova, e
# o passo falhava com "Failed to locate XML data". O 6.10 ainda tem o índice antigo, com a
# `win64_msvc2022_64`, e o defeito do `__yield` é só do ARM. Quando o `aqtinstall` entender o
# formato novo, o Windows volta para o 6.11.
#
# Fica de fora o Windows ARM64: o `install-qt-action` não tem ali o mesmo pacote de desktop que tem
# no x64, e a pergunta da fase 0 é se a ponte compila com MSVC e com o clang da Apple, não em
# quantas arquiteturas.

name: qt

on:
 workflow_dispatch:
 push:
  branches: [feat/migrate-qt]

concurrency:
  group: qt-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compila:
    name: ${{ matrix.nome }}
    runs-on: ${{ matrix.sistema }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: linux-x86_64
            sistema: ubuntu-24.04
            binario: target/release/zeebx
            qt: "6.11.*"
          - nome: windows-x86_64
            sistema: windows-latest
            binario: target/release/zeebx.exe
            qt: "6.10.*"
          - nome: macos-x86_64
            sistema: macos-15-intel
            binario: target/release/zeebx
            qt: "6.11.*"
          - nome: macos-arm64
            sistema: macos-latest
            binario: target/release/zeebx
            qt: "6.11.*"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: qt-${{ matrix.nome }}

      # A mesma lista do `ci.yml`: o núcleo e a janela do egui continuam no binário.
      - name: Dependências do Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config python3 libclang-dev \
            libglib2.0-dev libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev \
            libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxkbcommon-x11-0 libxcb-cursor0

      - name: Dependências do macOS
        if: runner.os == 'macOS'
        run: brew install cmake ninja pkg-config || true

      # Instala qtbase e qtdeclarative — o Qt Quick e o QML vêm no pacote de desktop — e põe o
      # `bin` do Qt no PATH, que é onde o Windows procura as DLLs na hora de abrir o binário.
      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          cache: true

      # O `cxx-qt-build` acha o Qt pelo `qmake`. Dizer qual evita pegar outro que esteja no PATH
      # da imagem do runner.
      - name: Compila
        shell: bash
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake${{ runner.os == 'Windows' && '.exe' || '' }}
        run: cargo build --release --locked -p zeebx-classical-standalone --features ui-qt

      # Os testes da ponte, e os do standalone de sempre, agora com o Qt linkado no binário de
      # teste.
      - name: Testes
        shell: bash
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake${{ runner.os == 'Windows' && '.exe' || '' }}
        run: cargo test --release --locked -p zeebx-classical-standalone --features ui-qt

      # `controles` não abre janela, mas o binário com Qt linkado precisa achar as bibliotecas do
      # Qt para chegar ao `main`: uma DLL ou um framework que não carrega falha aqui, antes de
      # qualquer linha nossa.
      - name: O binário abre (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ldd ${{ matrix.binario }} | grep -i qt
          timeout 60 ${{ matrix.binario }} controles

      - name: O binário abre (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          otool -L ${{ matrix.binario }} | grep -i qt
          perl -e 'alarm 60; exec @ARGV' ${{ matrix.binario }} controles

      - name: O binário abre (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $prova = Start-Process -FilePath "${{ matrix.binario }}" -ArgumentList "controles" -PassThru -NoNewWindow
          if (-not $prova.WaitForExit(60000)) { $prova.Kill(); throw "o binario pendurou" }
          if ($prova.ExitCode -ne 0) { throw "o binario saiu com $($prova.ExitCode)" }
