# Zeebx sem interface — arquivo de configuração.
#
# Tudo aqui é opcional: uma chave que falta vale o que está escrito como padrão, e um arquivo
# que não existe deixa o emulador abrir com as opções de fábrica. Comentário começa com `#` ou
# com `;`. Um valor com espaço ou com `#` no meio vai entre aspas.
#
# O emulador procura este arquivo ao lado do executável e depois na pasta de configuração do
# sistema (`~/.config/zeebx/`, `%APPDATA%\Zeebx\`, `~/Library/Application Support/Zeebx/`).
# `--config=CAMINHO` manda usar outro.

[video]
# janela | tela_cheia | sem_janela
# Em `sem_janela` nada é desenhado: o quadro sai pela seção [despejo] e quem pinta é o seu
# frontend. Nesse modo não há teclado — sem janela não há foco —, e quem joga usa um controle.
modo = janela
# Como o quadro preenche a janela: inteira (só múltiplos do quadro do console, nunca borra e
# sobra moldura), cabe (o maior que couber mantendo a proporção) ou estica (preenche tudo).
escala = cabe
# Interpolar ao ampliar. Desligado, o pixel do console aparece como bloco.
suave = nao
# Manter os 4:3 da tela do Zeebo. Desligado, o quadro se deforma para encher a janela.
proporcao_4_3 = sim
# Segurar o emulador no ritmo do console. Desligado, ele corre o quanto a máquina aguentar e os
# jogos ficam acelerados.
limite_velocidade = sim
# Esperar o retraço da tela para trocar o quadro.
vsync = sim
# O título da janela. Um frontend que gerencia janelas costuma casar por ele.
titulo = Zeebx
# O tamanho com que a janela abre, quando ela não é cheia.
largura = 1280
altura = 960

[grafico]
# Preencher o 3D do console na placa, em vez de na CPU. Muda **quem rasteriza**, e o desenho
# não sai idêntico ao de software — regra de borda e arredondamento divergem por construção.
# Mais rápido nos títulos medidos; a revisão jogo a jogo é de quem usa.
rasterizador_na_placa = nao
# A resolução interna do 3D na placa, em múltiplos de 640x480 por lado. Só vale com a linha
# acima ligada; o jogo continua vendo 640x480.
resolucao_interna = 1
# Antialias em amostras por pixel, e filtro anisotrópico das texturas. 1 desliga os dois.
antialias = 1
anisotropico = 1
# **Experimental.** A proporção em que o 3D na placa é renderizado: nativa | 16x9 | 16x10 |
# janela. Fora do nativo, a cena em perspectiva ganha lados em vez de ser esticada.
proporcao = nativa
# Deixar a névoa do jogo valer. No console ela costuma esconder o que a distância de desenho
# não alcançava; aqui a cena chega inteira, e quem prefere ver longe desliga.
neblina = sim

[audio]
ligado = sim
# De 0 a 100.
volume = 80

[sistema]
# Onde estão os jogos. É o que permite a Z-Wheel listar e abrir os títulos.
# No Windows, o caminho vai entre aspas por causa dos espaços: roms = "C:\Jogos\Zeebo"
# roms = /home/voce/roms/zeebo
# O pacote da Z-Wheel. É para ela que o console volta quando um jogo sai sozinho, como no
# aparelho de verdade. **Não é o que ele abre**: o jogo a rodar vem sempre da linha de comando,
# e para abrir pela Z-Wheel basta passá-la como jogo. Sem esta linha, um jogo que sai encerra o
# emulador.
# z_wheel = /home/voce/roms/zeebo/Z-Wheel.zip
# A roda inferior de fim de vida da Z-Wheel ("Jogar" e "Ajuda"), que é a de fábrica desta ROM.
z_wheel_fim_de_vida = sim
# Sair quando o jogo sair, em vez de voltar à Z-Wheel. É o que um frontend de fora costuma
# querer: a tela dele é que volta a aparecer.
sair_com_o_jogo = nao
# Quantos segundos de tempo do jogo rodar antes de sair sozinho. 0 roda até fecharem.
segundos = 0
# O idioma das mensagens do núcleo. Sem isto, o do sistema.
# idioma = pt-BR

# Só no modo `sem_janela`. Os quadros saem um atrás do outro, sempre do mesmo tamanho e sem
# cabeçalho nenhum — quem lê já sabe o tamanho, porque o console tem um só. Um quadro só é
# escrito quando muda.
#
# Nos formatos crus o quadro é sempre o do console, 640x480: um fluxo de bytes sem cabeçalho
# tem de ter o quadro do mesmo tamanho do começo ao fim, senão quem conta bytes do outro lado
# perde o passo. `resolucao_interna` e a proporção larga não chegam aqui — elas valem na
# janela. O `png` é a exceção, porque cada arquivo diz o próprio tamanho.
[despejo]
# rgb565 (dois bytes por pixel, do jeito que o console guarda — o mais barato), rgba (quatro
# bytes, na ordem R G B A) ou png (um arquivo por quadro, para conferir, não para tocar).
formato = rgb565
# `-` é a saída padrão, e é o que `zeebx-headless jogo.mod | seu-frontend` usa. Com um caminho,
# escreve nele — inclusive num FIFO, e aí nada passa por disco. Em `png`, é uma pasta.
destino = -
# Parar depois de tantos quadros. 0 é sem limite.
limite_de_quadros = 0

# As portas USB do console. Citar a seção já liga a porta; uma porta que o arquivo não cita
# fica como vem de fábrica — a primeira com um controle, a segunda livre.
#
# Os nomes de tecla e de botão são **os mesmos do settings.json** da interface do desktop, de
# propósito: um mapeamento copiado de lá vale aqui sem tradução, e a tela de controles continua
# sendo o jeito mais fácil de descobrir como um botão se chama. `--controles` lista os
# controles que o sistema enxerga, com os nomes que a chave `controle` espera.
[porta1]
ligada = sim
# O que o console enxerga ligado: controle (o Dragon), zpad, teclado ou boomerang.
aparelho = controle
# Qual controle do host alimenta esta porta. Vazio ou ausente deixa a porta só no teclado.
# controle = "Xbox Wireless Controller"

# Um botão do console por linha, com as origens separadas por vírgula: `tecla:NOME`,
# `botao:NOME` ou `eixo:NOME+` / `eixo:NOME-`. Escrever a linha **substitui** o padrão daquele
# botão. Os treze mapeáveis são up, down, left, right, b1, b2, b3, b4, zl, zr, lthumb, rthumb e
# back — o Zeebo não tem Start, e o HOME faz esse papel (é o `back`).
#
# up    = tecla:ArrowUp,    botao:DPadUp
# down  = tecla:ArrowDown,  botao:DPadDown
# left  = tecla:ArrowLeft,  botao:DPadLeft
# right = tecla:ArrowRight, botao:DPadRight
# b1    = tecla:Z,          botao:South
# b2    = tecla:X,          botao:East
# b3    = tecla:C,          botao:West
# b4    = tecla:V,          botao:North
# back  = tecla:Enter,      botao:Start

# Os quatro eixos analógicos do console, cada um vindo de um eixo do controle do host.
# `:invertido` vira o sentido. Uma linha vazia desliga o eixo.
# eixo_x  = LeftStickX
# eixo_y  = LeftStickY:invertido
# eixo_z  = RightStickX
# eixo_rz = RightStickY:invertido

# A segunda porta vem desligada. Descomente para o console enumerar dois aparelhos — é assim
# que se testa um jogo que se comporta diferente com dois controles.
# [porta2]
# ligada = sim
# aparelho = controle
# controle = "Outro controle"
