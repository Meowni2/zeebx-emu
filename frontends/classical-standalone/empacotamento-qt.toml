# Os instaladores da interface Qt, gerados pelo `.github/workflows/qt.yml` com
# `cargo packager --config empacotamento-qt.toml`. Ver a fase 9 de
# `docs/implementacao/21-migracao-para-qt.md`.
#
# **Separado do `[package.metadata.packager]` do `Cargo.toml` de propósito.** Aquele é o da release,
# que continua com a interface do egui até a licença passar para GPLv3. Quando passar, isto vira o
# de lá, e este arquivo sai. O nome não é `packager.toml` porque o `cargo packager` procura esse
# nome sozinho em toda a árvore, e a release pegaria este por engano.
#
# Com `--config`, o `cargo packager` não lê o `Cargo.toml`: a versão vem do workflow, que troca o
# `@VERSAO@` numa cópia deste arquivo, e o lugar do binário vai no `binaries-dir`.

# O `name` é o do pacote Cargo. Sem ele, o `cargo packager` 0.11.8 tenta descobrir o nome entrando
# no caminho deste *arquivo* como se fosse uma pasta, e para com "Not a directory".
name = "zeebx-classical-standalone"
product-name = "Zeebx"
version = "@VERSAO@"
identifier = "io.github.zeebxteam.zeebx"
publisher = "ZeebxTeam"
homepage = "https://github.com/ZeebxTeam/zeebx-emu"
category = "Game"
description = "O emulador definitivo de Zeebo!"
out-dir = "../../target/pacotes"
binaries-dir = "../../target/release"
before-packaging-command = "cargo build --release --locked -p zeebx-classical-standalone --features ui-qt"
icons = ["../../assets/icones/zeebx-512.png", "../../assets/icones/zeebx.ico", "../../assets/icones/zeebx.icns"]
# O Qt do Windows, que o `windeployqt` junta nesta pasta — as DLLs, os plugins e os módulos QML — e
# o NSIS instala ao lado do `zeebx.exe`, com as subpastas. Só existe no Windows: nos outros sistemas
# o caminho não casa com nada, e o `cargo packager` não inclui nada.
resources = [{ src = "../../target/qt-implantado", target = "." }]

[[binaries]]
path = "zeebx"
main = true

# O ALSA vai com o `libasound2t64` primeiro pelo motivo que o `Cargo.toml` explica: com o
# `libasound2` na frente, o Ubuntu 24.04 instalava uma imitação do ALSA sem todos os símbolos.
#
# O `.deb` usa o Qt do sistema, e por isso é compilado contra ele: um binário do Qt 6.11 não roda num
# Qt mais velho, e o Ubuntu 24.04 traz o 6.4. As bibliotecas de janela e de áudio são as do `.deb`
# do egui, que continua no binário; as do Qt são as que o binário linka, conferidas com `ldd` e
# `dpkg -S` num Ubuntu 24.04 — o `gui`, o `network` e o `opengl` com os dois nomes, porque o Ubuntu
# 24.04 os chama com `t64` e o Debian 13 sem; e os módulos QML são os que os `import` pedem, mais o
# `qt6-wayland`, sem o qual a janela abre pelo XWayland.
[deb]
section = "games"
depends = [
    "libasound2t64 | libasound2",
    "libudev1",
    "libgl1",
    "libxkbcommon0",
    "libatomic1",
    "libx11-6",
    "libxcursor1",
    "libxrandr2",
    "libxi6",
    "libwayland-client0",
    "libqt6core6t64",
    "libqt6gui6t64 | libqt6gui6",
    "libqt6network6t64 | libqt6network6",
    "libqt6opengl6t64 | libqt6opengl6",
    "libqt6qml6",
    "libqt6qmlmodels6",
    "libqt6quick6",
    "qt6-qpa-plugins",
    "qt6-wayland",
    "qml6-module-qtquick",
    "qml6-module-qtquick-controls",
    "qml6-module-qtquick-layouts",
    "qml6-module-qtquick-templates",
    "qml6-module-qtquick-window",
    "qml6-module-qtqml-workerscript",
]

# O AppImage leva o próprio Qt, o mesmo 6.11 do desenvolvimento: o `linuxdeploy-plugin-qt` copia as
# bibliotecas, os plugins e os módulos QML que o `QML_SOURCES_PATHS` pede. O `QMAKE` diz de qual Qt.
[appimage]
linuxdeploy-plugins = { qt = "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage" }
